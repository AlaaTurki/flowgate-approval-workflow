spring.application.name=flowgate-backend
server.port=${SERVER_PORT:9090}

# Datasource (local defaults)
spring.datasource.url=jdbc:postgresql://localhost:5433/flowgate
spring.datasource.username=${POSTGRES_USER:flowgate}
spring.datasource.password=${POSTGRES_PASSWORD:flowgatepass}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:change-me-please-make-it-very-long-and-secure-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Springdoc OpenAPI paths
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

